<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gratificação CTT — Motoristas e Operadores · CRV Industrial</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">
  <div class="topo">
    <div class="topo-linha">
      <img class="logo-crv" alt="CRV Industrial" src="{{ url_for('static', filename='assets/logo_crv.png') }}">
      <div>
        <h1>Gratificação CTT — Motoristas &amp; Operadores</h1>
        <div class="sub" id="subPeriodo">Período de apuração: —</div>
      </div>
    </div>
    <div class="abas" id="abas">
      <button class="aba" data-v="dados">Dados</button>
      <button class="aba" data-v="parametros">Parâmetros</button>
      <button class="aba" data-v="calculo">Cálculo</button>
      <button class="aba" data-v="semanal">Relatório semanal</button>
      <button class="aba" data-v="diretoria">Painel diretoria</button>
      <button class="aba" data-v="extrato">Extrato colaborador</button>
      <label class="switch-nomes no-print" title="Nos relatórios só circula a matrícula; nomes apenas para conferência interna">
        <input type="checkbox" id="chkNomes"> Exibir nomes (conferência interna)
      </label>
    </div>
  </div>

  <div class="corpo" id="corpo">
    <div class="aviso" id="aviso" style="display:none"></div>
    <main id="main"></main>
  </div>

  <div class="rodape">Gratificação CTT · CRV Industrial</div>
</div>

<div class="toast" id="toast"></div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
